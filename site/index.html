<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub Arcade — 经典网页游戏合集 · DSH 侧边栏小游戏</title>
<meta name="description" content="GameHub Arcade：开源经典网页游戏合集，益智/街机/棋牌/射击等分类，即点即玩，无需安装。DeepSeek Harness 侧边栏插件同步收录。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="./">🎮 <span>GameHub</span></a>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索游戏… (Ctrl+K)" autocomplete="off">
    </div>
    <div class="header-actions">
      <button id="random-btn" class="btn-ghost" title="随机一个游戏">🎲 随机</button>
      <button id="theme-btn" class="btn-ghost" title="切换主题">🌙</button>
    </div>
  </div>
  <nav id="cats" class="cat-nav" aria-label="分类"></nav>
</header>

<main id="main" class="container">
  <section id="hero" class="hero">
    <h1>经典网页游戏合集<span class="hero-sub"> · 即点即玩 · 无需安装</span></h1>
    <p id="hero-count"></p>
  </section>
  <section id="grid" class="grid" aria-live="polite"></section>
  <p id="empty" class="empty" hidden>没有找到匹配的游戏 🤷</p>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>GameHub · 开源游戏聚合 · 每个游戏版权与许可归其上游作者</p>
    <p><a href="https://github.com/bihong2026/dsh-arcade" target="_blank" rel="noopener">GitHub</a> ·
       <a href="#" id="plugin-link">安装插件</a> ·
       <a href="#" id="add-link">收录新游戏</a></p>
  </div>
</footer>

<!-- Player modal -->
<div id="player" class="player" hidden role="dialog" aria-modal="true">
  <div class="player-bar">
    <button id="player-close" class="btn-ghost" aria-label="关闭">← 返回</button>
    <div id="player-title" class="player-title"></div>
    <div class="player-tools">
      <button id="player-reload" class="btn-ghost" title="重新加载">↻</button>
      <button id="player-full" class="btn-ghost" title="全屏">⛶</button>
      <a id="player-open" class="btn-ghost" target="_blank" rel="noopener" title="新窗口打开">↗</a>
    </div>
  </div>
  <iframe id="player-frame" title="游戏窗口"
    allow="fullscreen; autoplay; gamepad; clipboard-write"
    sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-forms allow-modals allow-orientation-lock allow-presentation allow-downloads"></iframe>
</div>

<script src="assets/app.js"></script>
</body>
</html>
